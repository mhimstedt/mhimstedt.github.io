<!DOCTYPE html>
<html>
<head>
    <title>Firebase Auth Test</title>
    <!-- Firebase SDK laden -->
    <script src="https://www.gstatic.com/firebasejs/10.x.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.x.x/firebase-auth-compat.js"></script>
    <script>
        // Ihre Firebase-Konfiguration hier einfügen
        const firebaseConfig = {
                apiKey: "AIzaSyACKGdU-5QQeYtkTuOB_Em4Aoo8rh9PAVk",
                authDomain: "gprog-5d6d0.firebaseapp.com",
                projectId: "gprog-5d6d0",
                storageBucket: "gprog-5d6d0.firebasestorage.app",
                messagingSenderId: "996478483306",
                appId: "1:996478483306:web:f0d86e4a90db05ad620313"
        };
        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();

        function signIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Angemeldet!
                    const user = userCredential.user;
                    document.getElementById('status').innerText = `Erfolgreich angemeldet als: ${user.email}`;
                })
                .catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    document.getElementById('status').innerText = `Fehler beim Login: ${errorMessage}`;
                    console.error("Login-Fehler:", errorCode, errorMessage);
                });
        }

        function signOut() {
            auth.signOut().then(() => {
                document.getElementById('status').innerText = 'Abgemeldet.';
            }).catch((error) => {
                console.error("Logout-Fehler:", error);
            });
        }
    </script>
</head>
<body>
    <h1>Login Test</h1>
    <input type="email" id="email" placeholder="E-Mail">
    <input type="password" id="password" placeholder="Passwort">
    <button onclick="signIn()">Login</button>
    <button onclick="signOut()">Logout</button>
    <p id="status"></p>
</body>
</html>
