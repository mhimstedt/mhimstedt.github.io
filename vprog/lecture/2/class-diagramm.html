<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Java IDE Embed</title>
  <head>
  <script>
    const params = new URLSearchParams(window.location.search);
    const passedId = params.get("id") || "";
    window.progLectureId = passedId;
  </script>
    
</head>

</head>
<body>

  <iframe class="ideFrame" width="1000" height="600" 
    frameborder="0" allow="fullscreen" allowfullscreen
    srcdoc="
    <script>
      window.jo_doc = window.frameElement.textContent;
    </script>
    <script src='https://mhimstedt.github.io/prog/includeIDE.js'></script>" >
    {
      'id': '${passedId}',
      'speed': 1000,
      'withBottomPanel': true ,
      'withPCode': false ,
      'withConsole': false ,
      'withFileList': true ,
      'withErrorList': true
    }
    <script type="plain/text" title="Fahrzeug.java">
class Fahrzeug {
  private String modell;

  public Fahrzeug(String modell) {
    this.modell = modell;
  }

  public String getModell() {
    return this.modell;
  }
}
    </script>
    <script type="plain/text" title="Auto.java">
class Auto extends Fahrzeug {
  private int kmStand;

  public Auto(String modell, int kmStand) {
      super(modell);
      this.kmStand = kmStand;
  }

  public int getKmStand() {
      return this.kmStand;
  }
}
    </script>
    <script type="plain/text" title="Main.java">
Fahrzeug fahrzeug = new Fahrzeug("Superfast");
Auto auto = new Auto("Superfast", 10000);
println(fahrzeug.getModell());
println(auto.getKmStand());
    </script>


    </iframe>


</body>
</html>
