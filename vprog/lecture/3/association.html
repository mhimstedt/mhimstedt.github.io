<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Java IDE Embed</title>
  <head>
  <script>
    const params = new URLSearchParams(window.location.search);
    const passedId = params.get("id") || "";
    window.progLectureId = passedId;
  </script>
    
</head>

</head>
<body>

  <iframe class="ideFrame" width="1000" height="600" 
    frameborder="0" allow="fullscreen" allowfullscreen
    srcdoc="
    <script>
      window.jo_doc = window.frameElement.textContent;
    </script>
    <script src='https://mhimstedt.github.io/prog/includeIDE.js'></script>" >
    {
      'id': '${passedId}',
      'speed': 1000,
      'withBottomPanel': true ,
      'withPCode': false ,
      'withConsole': false ,
      'withFileList': true ,
      'withErrorList': true
    }
    <script type="plain/text" title="Main.java">
class Student {
  	private Course[] courses;
    
   public void setCourses(Course[] courses) {
      this.courses = courses;
   }
}

class Course {
  	private Student[] students;

   public void setStudents(Student[] students) {
      this.students = students;
   }
}

Student[] students = new Student[2];
students[0] = new Student();
students[1] = new Student();

Course[] courses = new Course[2];
courses[0] = new Course();
courses[1] = new Course();

students[0].setCourses(courses);
students[1].setCourses(courses);

courses[0].setStudents(students);
courses[1].setStudents(students);
    </script>

  </iframe>


</body>
</html>
