<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Shader Übungen</title>

  <link rel="stylesheet" href="build/glslEditor.css">

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: #eee;
    }

    .section {
      padding: 40px;
      border-bottom: 1px solid #333;
    }

    .task {
      max-width: 800px;
      margin-bottom: 20px;
    }

    .editor {
      height: 400px;
    }

    h2 {
      color: #6cf;
    }
  </style>
</head>

<body>

  <!-- Aufgabe 1 -->
  <div class="section">
    <div class="task">
      <h2>Aufgabe 1: Farbverlauf</h2>
      <p>
        Erzeuge einen horizontalen Farbverlauf von Schwarz nach Weiß.
        Nutze <code>gl_FragCoord</code>.
      </p>
    </div>

    <div id="editor1" class="editor"></div>
  </div>

  <!-- Aufgabe 2 -->
  <div class="section">
    <div class="task">
      <h2>Aufgabe 2: Sinus Animation</h2>
      <p>
        Nutze <code>sin()</code> und <code>u_time</code>, um eine animierte Welle zu erzeugen.
      </p>
    </div>

    <div id="editor2" class="editor"></div>
  </div>

  <script src="build/glslEditor.js"></script>
  <script>
    // Editor 1
    new GlslEditor('#editor1', {
      canvas_size: 400,
      theme: 'monokai',
      canvas_draggable: false,
      fragment: `
#ifdef GL_ES
precision mediump float;
#endif

void main() {
    vec2 st = gl_FragCoord.xy / vec2(400.0, 400.0);
    gl_FragColor = vec4(vec3(st.x), 1.0);
}
`
    });

    // Editor 2
    new GlslEditor('#editor2', {
      canvas_size: 400,
      theme: 'monokai',
      fragment: `
#ifdef GL_ES
precision mediump float;
#endif

uniform float u_time;

void main() {
    vec2 st = gl_FragCoord.xy / vec2(400.0, 400.0);
    float y = sin(st.x * 10.0 + u_time);
    gl_FragColor = vec4(vec3(y * 0.5 + 0.5), 1.0);
}
`
    });
  </script>

</body>
</html>
