<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Java IDE (div-Variante)</title>

  <!-- Richtige CSS-Datei -->
  <link rel="stylesheet" type="text/css"
        href="https://embed.learnj.de/include/online-ide-embedded.css">

  <!-- Richtige JS-Datei -->
  <script type="module" crossorigin
          src="https://embed.learnj.de/include/js/includeide/online-ide-embedded.js"></script>
</head>
<body>
  <h1>div-Variante Test</h1>

  <div class="java-online"
       style="width: calc(100% - 10px); height: 250px; margin-left: 5px"
       data-java-online='{
         "id": "Beispiel_1",
         "withBottomPanel": true,
         "withFileList": true,
         "withConsole": true,
         "withErrorList": true
       }'>
    <script type="text/plain" title="Main.java">
      public class Main {
        public static void main(String[] args) {
          for (int i = 0; i < 5; i++) {
            System.out.println("Zeile " + (i + 1));
          }
        }
      }
    </script>
  </div>
</body>
</html>
